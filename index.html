<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デュエマ管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>デュエマ 所持管理</h1>
  <span id="totalCount">読み込み中…</span>
</header>

<div class="container">
  <!-- 左サイドバー（PC用） -->
  <aside class="filters">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="collection" onclick="switchTab('collection')">📦 所持</button>
      <button class="tab-btn" data-tab="deck" onclick="switchTab('deck')">🃏 デッキ</button>
    </div>
    <div id="sidebarContent"></div>
  </aside>

  <!-- 中央：カード一覧 -->
  <main class="list">
    <div class="list-header">
      <span id="resultCount">0 件</span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="col-name">名前</th>
          <th class="col-civ">文明</th>
          <th class="col-cost">コスト</th>
          <th class="col-count">枚数</th>
        </tr>
      </thead>
      <tbody id="cardTable"></tbody>
    </table>
    <!-- ページャーはJS側でここに追加 -->
  </main>

  <!-- 右：詳細パネル（PC用） -->
  <aside class="detail" id="detail">
    <div class="detail-placeholder">← カードを選択してください</div>
  </aside>
</div>

<!-- ==============================
     スマホ用UI
     ============================== -->

<!-- ボトムナビ -->
<nav class="mobile-nav">
  <button class="mobile-nav-btn active" onclick="showMobileTab('list',this)">
    <span>☰</span><span>一覧</span>
  </button>
  <button class="mobile-nav-btn" onclick="showMobileTab('filter',this)">
    <span>🔍</span><span>検索</span>
  </button>
  <button class="mobile-nav-btn" onclick="showMobileTab('mylist',this)">
    <span>📁</span><span>リスト</span>
  </button>
  <button class="mobile-nav-btn" onclick="showMobileTab('deck',this)">
    <span>🃏</span><span>デッキ</span>
  </button>
</nav>

<!-- フィルターパネル -->
<div id="mobileFilterPanel" class="mobile-panel">
  <div class="mobile-panel-header">
    <span>🔍 絞り込み</span>
    <button onclick="closeMobilePanel('mobileFilterPanel')">✕</button>
  </div>
  <div class="mobile-panel-body" id="mobileFilterBody"></div>
</div>

<!-- リスト管理パネル -->
<div id="mobileListPanel" class="mobile-panel">
  <div class="mobile-panel-header">
    <span>📁 リスト管理</span>
    <button onclick="closeMobilePanel('mobileListPanel')">✕</button>
  </div>
  <div class="mobile-panel-body" id="mobileListBody"></div>
</div>

<!-- デッキ管理パネル -->
<div id="mobileDeckPanel" class="mobile-panel">
  <div class="mobile-panel-header">
    <span>🃏 デッキ管理</span>
    <button onclick="closeMobilePanel('mobileDeckPanel')">✕</button>
  </div>
  <div class="mobile-panel-body" id="mobileDeckBody"></div>
</div>

<!-- カード詳細モーダル -->
<div id="mobileModal" class="mobile-modal">
  <div class="mobile-modal-content">
    <button class="mobile-modal-close" onclick="closeMobileModal()">✕ 閉じる</button>
    <div id="mobileModalContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
